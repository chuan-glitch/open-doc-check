# 把此文件复制到你的项目 .github/workflows/check-docs.yml。
# 维护者发布 v0.1.0 标签后可使用。
name: Check documentation links
on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chuan-glitch/open-doc-check
          ref: v0.1.0
          path: .doc-check-tool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .doc-check-tool
      # 外部 PR 只做离线检查；可信分支及定时任务检查网页。
      - if: github.event_name == 'pull_request'
        run: node .doc-check-tool/bin/open-doc-check.js . --offline --exclude .doc-check-tool --format html --output reports/doc-check.html
      - if: github.event_name != 'pull_request'
        run: node .doc-check-tool/bin/open-doc-check.js . --exclude .doc-check-tool --format html --output reports/doc-check.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-check-report
          path: reports/doc-check.html
